# Reverse proxy fronting megapetd.
#
# The defaults matter more here than for a normal app: a speedtest is a long
# lived, deliberately unbuffered stream, and any buffering or timeout in the
# path shows up as a wrong number rather than an error.

upstream megapet {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name megapet.internal.example;

    ssl_certificate     /etc/ssl/certs/speedtest.crt;
    ssl_certificate_key /etc/ssl/private/speedtest.key;

    # An upload phase pushes gigabytes through this location.
    client_max_body_size 0;
    client_body_buffer_size 512k;

    # Compress the page and its assets — the bundle is 144 kB raw and 39 kB
    # gzipped, so turning this off costs every visitor 100 kB.
    #
    # The measurement payloads are never touched: the server marks them
    # `Content-Encoding: identity`, and nginx skips any response that already
    # declares an encoding. gzip_proxied is required because the default is to
    # compress nothing that came from an upstream.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://megapet;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream both directions instead of spooling to disk.
        proxy_buffering off;
        proxy_request_buffering off;

        # A phase runs for as long as the server config says; leave headroom.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;
    }
}
