name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          # Pinned by .nvmrc so CI and a developer's machine agree; the build
          # is reproducible, and a floating major would be the one input able
          # to break that silently.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: make web-deps

      # gofmt, go vet, both test suites and tsc, without rewriting anything.
      - name: Verify
        run: make verify

      - name: Build
        run: make build

      # The same source and the same VERSION must produce the same bytes, or
      # nobody can check that a published binary came from the tag it claims.
      # It is cheap to assert and easy to lose: a stray timestamp, an
      # embedded path or a VCS stamp all break it silently.
      - name: Build is reproducible
        run: |
          set -eu
          # Both builds are given the same explicit VERSION. Left implicit it
          # is derived from `git describe`, so the two trees below would ask
          # for different versions, and VERSION is stamped into the binary:
          # the comparison would fail for a reason that is not a bug.
          V=reproducibility-check
          # `./dist`, not `dist`: tar matches the paths it emits, which are
          # relative to the `.` it was given. dist/ is excluded so neither
          # copy starts from the other's output, and the real build artifact
          # uploaded below is left alone.
          rm -rf /tmp/withgit /tmp/nogit
          mkdir /tmp/withgit /tmp/nogit
          tar --exclude=./dist -cf - . | tar -xf - -C /tmp/withgit
          # The second tree has no .git, which is how a release built from an
          # exported tarball sees the source. That difference is exactly what
          # used to make CI and a hand-built binary disagree.
          tar --exclude=./dist --exclude=./.git -cf - . | tar -xf - -C /tmp/nogit
          make -C /tmp/withgit build VERSION="$V" >/dev/null
          make -C /tmp/nogit build VERSION="$V" >/dev/null
          first="$(sha256sum /tmp/withgit/dist/megapetd | cut -d' ' -f1)"
          second="$(sha256sum /tmp/nogit/dist/megapetd | cut -d' ' -f1)"
          if [ "$first" != "$second" ]; then
            echo "::error::build is not reproducible"
            echo "with .git:    $first"
            echo "without .git: $second"
            exit 1
          fi
          echo "reproducible: $first"

      - uses: actions/upload-artifact@v4
        with:
          name: megapetd-linux-amd64
          path: dist/megapetd
          if-no-files-found: error
