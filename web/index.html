<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Measure your connection speed: download, upload, latency and jitter." />
    <meta name="color-scheme" content="light dark" />
    <!--
      This page generates its own light and dark palettes from one seed colour,
      so a re-theming extension has nothing to add and a great deal to break:
      Dark Reader would invert an already-dark theme and flatten the generated
      tones. This is the documented opt-out, and it is only honest because the
      dark theme is real.
    -->
    <meta name="darkreader-lock" />
    <meta name="theme-color" content="#12131A" />
    <title>Megapet</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Paint the right background before the bundle evaluates, so a reload
         never flashes white on a dark desktop. */
      :root { color-scheme: light dark; background: #faf8fd; }
      @media (prefers-color-scheme: dark) { :root { background: #121318; } }
      html[data-theme='dark'] { background: #121318; }
      html[data-theme='light'] { background: #faf8fd; }
      body { margin: 0; }
      #boot { display: grid; place-items: center; min-height: 100vh; }
      #boot span {
        width: 2.5rem; height: 2.5rem; border-radius: 50%;
        border: 3px solid rgba(128, 128, 128, 0.25); border-top-color: #4f6bed;
        animation: spin 900ms linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot span { animation-duration: 3s; } }
    </style>
  </head>
  <body>
    <div id="app"><div id="boot"><span role="progressbar" aria-label="Loading"></span></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
